<!doctype html>
<!-- =====================================================================
  OG IMAGE SOURCE — the 1200×630 social sharing card.
  Edit, then run:  node scripts/print-og-image.mjs
  Renders scripts/og-image/og.html → public/og-image.png
====================================================================== -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #16213e;
        --accent: #0ea5e9;
        --accent-bright: #38bdf8;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      body {
        font-family: "Inter", system-ui, sans-serif;
        background: linear-gradient(135deg, #101b33 0%, #16213e 45%, #0b1220 100%);
        color: #fff;
        position: relative;
      }

      /* subtle blueprint grid */
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(148, 190, 255, 0.07) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(148, 190, 255, 0.07) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(80% 80% at 30% 40%, black, transparent 90%);
      }
      /* accent glows */
      .glow1 {
        position: absolute;
        top: -160px;
        left: -120px;
        width: 560px;
        height: 560px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(14, 165, 233, 0.35), transparent 70%);
      }
      .glow2 {
        position: absolute;
        bottom: -180px;
        right: 200px;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.18), transparent 70%);
      }

      .card {
        position: relative;
        display: flex;
        height: 100%;
        padding: 64px 72px;
        gap: 56px;
        align-items: center;
      }

      /* left: copy */
      .copy {
        flex: 1;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.28em;
        color: var(--accent-bright);
        text-transform: uppercase;
      }
      .chip .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 18px rgba(56, 189, 248, 0.9);
      }
      h1 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 74px;
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1.05;
        margin-top: 26px;
      }
      .headline {
        margin-top: 18px;
        font-family: "Space Grotesk", sans-serif;
        font-size: 30px;
        font-weight: 600;
        color: #cfe3f7;
        letter-spacing: 0.02em;
      }
      .headline b {
        color: var(--accent-bright);
        font-weight: 700;
      }
      .bar {
        margin-top: 34px;
        width: 120px;
        height: 6px;
        border-radius: 3px;
        background: linear-gradient(to right, var(--accent), rgba(56, 189, 248, 0.15));
      }
      .meta {
        margin-top: 26px;
        font-size: 18px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.62);
        letter-spacing: 0.02em;
      }
      .meta span {
        margin: 0 10px;
        color: rgba(56, 189, 248, 0.8);
      }

      /* right: portrait */
      .photo-wrap {
        position: relative;
        flex-shrink: 0;
      }
      .photo-ring {
        position: absolute;
        inset: -18px;
        border-radius: 40px;
        background: linear-gradient(135deg, rgba(14, 165, 233, 0.5), rgba(56, 189, 248, 0.08) 55%, transparent);
        filter: blur(6px);
      }
      .photo {
        position: relative;
        width: 348px;
        height: 420px;
        border-radius: 32px;
        overflow: hidden;
        border: 3px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.65);
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow1"></div>
    <div class="glow2"></div>

    <div class="card">
      <div class="copy">
        <span class="chip"><span class="dot"></span>Portfolio</span>
        <h1>Dominic<br />Torres</h1>
        <p class="headline">Computer Science Student · Developer · <b>QA Tester</b></p>
        <div class="bar"></div>
        <p class="meta">dominic.torres2704@gmail.com <span>|</span> Philippines <span>|</span> github.com/litebanana</p>
      </div>

      <div class="photo-wrap">
        <div class="photo-ring"></div>
        <div class="photo">
          <img src="../../public/images/dominic.jpg" alt="" />
        </div>
      </div>
    </div>
  </body>
</html>
